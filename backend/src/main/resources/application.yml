# Configuración base de Utqallya Backend.
# Los valores sensibles se leen de variables de entorno; ver docs/ENVIRONMENT.md
spring:
  application:
    name: utqallya-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/utqallya}
    username: ${DB_USERNAME:utqallya}
    password: ${DB_PASSWORD:utqallya}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate # el esquema lo controla Flyway, nunca Hibernate en producción
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Propiedades propias de la aplicación (com.utqallya.backend.config.AppProperties)
utqallya:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-please-32-bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  trip:
    search-radius-meters: ${TRIP_SEARCH_RADIUS_METERS:4000}
    confirmation-code-length: ${TRIP_CODE_LENGTH:4}
    driver-response-timeout-seconds: ${TRIP_DRIVER_TIMEOUT_SECONDS:60}
    base-fare: ${TRIP_BASE_FARE:3.0}
    fare-per-km: ${TRIP_FARE_PER_KM:1.5}
    average-speed-kmh: ${TRIP_AVERAGE_SPEED_KMH:25}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  firebase:
    credentials-file: ${FIREBASE_CREDENTIALS_FILE:}
    enabled: ${FIREBASE_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:19006,http://localhost:8081}
