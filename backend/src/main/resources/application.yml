# Configuración base de Utqallya Backend.
# Los valores sensibles se leen de variables de entorno; ver docs/ENVIRONMENT.md
spring:
  application:
    name: utqallya-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/utqallya}
    username: ${DB_USERNAME:utqallya}
    password: ${DB_PASSWORD:utqallya}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate # el esquema lo controla Flyway, nunca Hibernate en producción
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-no-request-id}] %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

management:
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# Propiedades propias de la aplicación (com.utqallya.backend.config.AppProperties)
utqallya:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-please-32-bytes-min}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  trip:
    search-radius-meters: ${TRIP_SEARCH_RADIUS_METERS:4000}
    confirmation-code-length: ${TRIP_CODE_LENGTH:4}
    driver-response-timeout-seconds: ${TRIP_DRIVER_TIMEOUT_SECONDS:180}
    average-speed-kmh: ${TRIP_AVERAGE_SPEED_KMH:25}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  firebase:
    credentials-file: ${FIREBASE_CREDENTIALS_FILE:}
    enabled: ${FIREBASE_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:19006,http://localhost:8081,http://localhost:5173}
  directions:
    api-key: ${DIRECTIONS_API_KEY:}
    enabled: ${DIRECTIONS_ENABLED:false}
  password-reset:
    mail-enabled: ${MAIL_ENABLED:false}
    mail-from: ${MAIL_FROM:no-reply@utqallya.pe}
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:15}
    max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
