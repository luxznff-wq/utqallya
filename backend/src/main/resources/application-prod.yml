# Perfil de producción. Todo se alimenta de variables de entorno reales del servidor.
logging:
  level:
    com.utqallya.backend: INFO
    org.hibernate.SQL: WARN

spring:
  datasource:
    # La base de datos SÍ es obligatoria: la app no tiene sentido sin ella.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  mail:
    # SMTP opcional para arrancar: si no está configurado, el envío de correos
    # (recuperar contraseña, avisos) simplemente no funciona hasta completarlo,
    # pero el resto de la app (viajes, ofertas, etc.) sigue operativo.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  error:
    include-message: never
    include-binding-errors: never

management:
  health:
    mail:
      # Solo se chequea la salud del correo si explícitamente se habilita
      # (evita que /health quede en DOWN cuando aún no hay SMTP configurado).
      enabled: ${MAIL_HEALTH_ENABLED:false}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

utqallya:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    # Por defecto solo el panel admin en local; en producción se sobreescribe
    # con el dominio real (ej. https://admin.tudominio.com).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  password-reset:
    # El envío por correo se activa solo cuando hay SMTP configurado.
    mail-enabled: ${PASSWORD_RESET_MAIL_ENABLED:false}
    mail-from: ${MAIL_FROM:no-reply@utqallya.pe}
