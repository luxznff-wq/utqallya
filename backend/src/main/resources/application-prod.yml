# Perfil de producción. Todo se alimenta de variables de entorno reales del servidor.
logging:
  level:
    com.utqallya.backend: INFO
    org.hibernate.SQL: WARN

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

server:
  error:
    include-message: never
    include-binding-errors: never

management:
  health:
    mail:
      enabled: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

utqallya:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  password-reset:
    mail-enabled: true
    mail-from: ${MAIL_FROM}
